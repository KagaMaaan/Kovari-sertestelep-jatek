<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Hamarosan — A Kővári Sertéstelep</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nosifer&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --blood: #5c0e0e;
  --blood-bright: #8b1010;
  --bone: #d8cdb8;
  --pitch: #0a0806;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background: radial-gradient(ellipse at center, var(--blood-bright) 0%, var(--blood) 45%, var(--pitch) 100%);
  color:var(--bone);
  font-family:'Crimson Text', serif;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* --- film grain (ugyanaz mint a fő oldalon) --- */
body::before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  z-index:5;
  opacity:0.08;
  background-image:
    radial-gradient(circle at 20% 30%, #fff 0.5px, transparent 0.5px),
    radial-gradient(circle at 60% 70%, #fff 0.5px, transparent 0.5px),
    radial-gradient(circle at 80% 20%, #fff 0.5px, transparent 0.5px);
  background-size: 3px 3px, 5px 5px, 4px 4px;
  animation: grain 0.4s steps(2) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0);}
  50%{transform:translate(-1px,1px);}
  100%{transform:translate(1px,-1px);}
}

/* --- VHS scanlines --- */
body::after{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  z-index:6;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.25) 0px,
    rgba(0,0,0,0.25) 1px,
    transparent 2px,
    transparent 3px
  );
  mix-blend-mode:multiply;
}

/* --- VHS tracking sáv, ami időnként végigfut a képen --- */
.tracking{
  position:fixed; left:0; right:0;
  height:14px;
  background:rgba(255,255,255,0.06);
  z-index:7;
  pointer-events:none;
  animation: trackingMove 7s linear infinite;
  mix-blend-mode:overlay;
}
@keyframes trackingMove{
  0%{top:-14px;}
  100%{top:100%;}
}

/* --- vignette --- */
.vignette{
  position:fixed; inset:0; pointer-events:none; z-index:4;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
}

.wrap{position:relative; z-index:2; padding:6vw;}

h1{
  font-family:'Nosifer', cursive;
  color:var(--bone);
  text-shadow: 0 0 14px rgba(0,0,0,0.8), 0 0 4px #000;
  font-size:clamp(2.2rem, 8vw, 4.5rem);
  letter-spacing:4px;
  margin:0 0 0.4em 0;
  animation: flicker 5s infinite;
}
@keyframes flicker{
  0%,19%,21%,23%,55%,57%,100%{opacity:1;}
  20%,22%,56%{opacity:0.4;}
}

p.placeholder{
  font-style:italic;
  color:rgba(216,205,184,0.75);
  font-size:1.5em;
  max-width:500px;
  margin:0 auto;
  padding:0.8em 1.2em;
}

.sound-hint{
  margin-top:2.5em;
  font-size:0.8em;
  letter-spacing:1px;
  color:rgba(216,205,184,0.4);
}

/* --- old TV power-on sequence --- */
.tv-boot{
  position:fixed; inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:transparent;
  /* Keep the black CRT frame visible while the page opens in the center. */
  animation: bootCurtain 2.2s ease forwards;
  animation-play-state:paused;
}
.tv-boot.started{
  animation-play-state:running;
}
.switch{
  position:relative;
  z-index:1;
  width:210px;
  height:50px;
  padding:3px;
  background:#0d0d0d;
  border-radius:6px;
  box-shadow:inset 0 1px 1px 1px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1);
  /* Fade the entire black housing as soon as the switch finishes moving. */
  transition:opacity 0.15s ease 0.5s;
}
.switch input[type="checkbox"]{
  position:absolute;
  z-index:1;
  width:100%;
  height:100%;
  margin:0;
  opacity:0;
  cursor:pointer;
}
.switch input[type="checkbox"] + label{
  position:relative;
  display:block;
  left:0;
  width:50%;
  height:100%;
  background:#1b1c1c;
  border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
  transition:all 0.5s ease-in-out;
}
.switch input[type="checkbox"] + label::before{
  content:"";
  position:absolute;
  top:50%;
  left:10px;
  width:5px;
  height:5px;
  transform:translateY(-50%);
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 5px 2px rgba(165,15,15,0.9), 0 0 3px 1px rgba(165,15,15,0.9);
  transition:box-shadow 0.5s ease-in-out;
}
.switch input[type="checkbox"] + label::after{
  content:"";
  display:inline-block;
  width:0;
  height:100%;
  vertical-align:middle;
}
.switch input[type="checkbox"] + label i,
.switch input[type="checkbox"] + label i::before,
.switch input[type="checkbox"] + label i::after{
  position:absolute;
  display:block;
  width:3px;
  height:24px;
  border-radius:2px;
  background:#0d0d0d;
  box-shadow:0 1px 0 rgba(255,255,255,0.3);
}
.switch input[type="checkbox"] + label i{
  top:50%;
  left:50%;
  margin-top:-12px;
  margin-left:-1.5px;
}
.switch input[type="checkbox"] + label i::before,
.switch input[type="checkbox"] + label i::after{
  content:"";
  top:0;
}
.switch input[type="checkbox"] + label i::before{left:-7px;}
.switch input[type="checkbox"] + label i::after{left:7px;}
.switch input[type="checkbox"]:checked + label{
  left:50%;
}
.switch input[type="checkbox"]:checked + label::before{
  box-shadow:0 0 5px 2px rgba(15,165,70,0.9), 0 0 3px 1px rgba(15,165,70,0.9);
}
.switch input[type="checkbox"]:focus-visible + label{
  outline:2px solid var(--bone);
  outline-offset:4px;
}
.tv-boot.started .switch{
  animation:switchFade 0.15s ease forwards;
  pointer-events:none;
}
@keyframes switchFade{
  0%{opacity:1;}
  100%{opacity:0; visibility:hidden;}
}
.tv-boot::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:3px;
  transform:translate(-50%,-50%);
  background:transparent;
  border:3px solid rgba(72,72,72,0.78);
  border-radius:11% 7% 10% 6% / 9% 6% 8% 5%;
  box-shadow:
    0 0 0 100vmax #030303,
    0 0 22px 8px rgba(0,0,0,0.9),
    inset 0 0 18px rgba(255,255,255,0.08);
  /* Grow a transparent screen window while black remains at the edges. */
  animation: powerLine 1.1s cubic-bezier(0.7,0,0.2,1) forwards;
  animation-play-state:paused;
}
.tv-boot.started::before{
  animation-play-state:running;
}
.tv-boot::after{
  content:"";
  position:absolute; inset:0;
  clip-path:inset(8vh 4vw round 11% 7% 10% 6% / 9% 6% 8% 5%);
  background:
    linear-gradient(118deg, transparent 25%, rgba(220,220,220,0.1) 42%, rgba(255,255,255,0.2) 48%, transparent 62%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.12) 0 1px, transparent 1px 4px);
  opacity:0;
  /* Flash scanline static briefly while the TV signal stabilizes. */
  animation: bootStatic 1.1s steps(2, end) forwards;
  animation-play-state:paused;
}
.tv-boot.started::after{
  animation-play-state:running;
}
@keyframes powerLine{
  /* Start with the page completely covered by black. */
  0%{width:0; height:3px;}
  /* Open a narrow horizontal CRT slit. */
  18%{width:4px; height:3px;}
  /* Expand the slit into the central viewing area. */
  55%{width:92vw; height:84vh;}
  /* Keep the black CRT edges after the page is revealed. */
  100%{width:92vw; height:84vh;}
}
@keyframes bootStatic{
  /* Keep static hidden until the power line appears. */
  0%,55%{opacity:0;}
  /* Make the signal flicker briefly. */
  58%,74%{opacity:0.7;}
  /* Clear the static. */
  100%{opacity:0;}
}
@keyframes bootCurtain{
  /* Keep the frame present while the central screen opens. */
  0%,55%{opacity:1; visibility:visible;}
  100%{opacity:1; visibility:visible; pointer-events:none;}
}
@media (prefers-reduced-motion: reduce){
  /* Use a short fade for visitors who prefer less motion. */
  .tv-boot{animation:bootCurtain 0.8s linear forwards; animation-play-state:paused;}
  .tv-boot.started{animation-play-state:running;}
  /* Disable the bright flash and static effects. */
  .tv-boot::before,.tv-boot::after{animation:none; opacity:0;}
}
</style>
</head>
<body>

<div class="tv-boot">
  <div class="switch">
    <input id="power-toggle" type="checkbox" aria-label="Power on">
    <label for="power-toggle"><i></i></label>
  </div>
</div>
<div class="vignette"></div>
<div class="tracking"></div>

<audio id="tv-on-sound" src="audio/tvbe.mp3" preload="auto"></audio>
<audio id="lobby-sound" src="audio/lobby.mp3" preload="auto" loop></audio>

<div class="wrap">
  <h1>HAMAROSAN</h1>
  <p class="placeholder">Halk röfögést hallasz... Valami készül.</p>
</div>

<script>
  const bootOverlay = document.querySelector('.tv-boot');
  const powerToggle = document.querySelector('#power-toggle');
  const tvOnSound = document.querySelector('#tv-on-sound');
  const lobbySound = document.querySelector('#lobby-sound');
  let lobbyStarted = false;

  function startLobbySound() {
    if (lobbyStarted) return;
    lobbyStarted = true;
    lobbySound.volume = 0;
    Promise.resolve(lobbySound.play()).then(() => {
      const fadeStart = performance.now();
      const fadeDuration = 2000;

      function fadeInLobby(currentTime) {
        const progress = Math.min((currentTime - fadeStart) / fadeDuration, 1);
        lobbySound.volume = progress;
        if (progress < 1) requestAnimationFrame(fadeInLobby);
      }

      requestAnimationFrame(fadeInLobby);
    }).catch(() => {
      lobbyStarted = false;
      lobbySound.volume = 1;
    });
  }

  powerToggle.addEventListener('change', () => {
    if (!powerToggle.checked) return;
    powerToggle.disabled = true;

    // Let the switch finish, then wait another half-second before powering on.
    setTimeout(() => {
      bootOverlay.classList.add('started');
      tvOnSound.play().catch(() => {});
    }, 1000);
  });

  // Start the lobby music only after the boot overlay is fully gone.
  bootOverlay.addEventListener('animationend', (event) => {
    if (event.animationName === 'bootCurtain') startLobbySound();
  });

</script>

</body>
</html>
